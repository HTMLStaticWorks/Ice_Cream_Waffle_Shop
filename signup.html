<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://placehold.co/32x32/FF4F87/FFFDFC?text=W" type="image/x-icon">
    <title>Sign Up | SweetTreats</title>
    <!-- Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--secondary-color) 0%, #FFF9EC 100%);
            position: relative;
            padding: 40px 20px;
        }
        .auth-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
        }
        .auth-panel {
            width: 100%;
            max-width: 450px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-dark);
            border-radius: var(--border-radius-lg);
            padding: 40px;
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: var(--border-radius-pill);
            padding: 12px;
            border: 1px solid #ddd;
            background: var(--white);
            color: var(--text-color);
            transition: all var(--transition-fast);
            text-decoration: none;
            font-weight: 500;
        }
        .social-btn:hover {
            background: #f8f9fa;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }
        
        .hover-underline:hover {
            text-decoration: underline !important;
        }
        
        .password-toggle {
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="auth-page">
        <!-- Top Right Controls -->
        <div class="auth-controls">
            <button class="btn btn-outline-custom rounded-circle d-flex align-items-center justify-content-center" style="width:40px;height:40px;" id="theme-toggle" title="Toggle Dark Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="btn btn-outline-custom rounded-circle d-flex align-items-center justify-content-center" style="width:40px;height:40px;" id="rtl-toggle" title="Toggle RTL">
                <i class="fa-solid fa-right-left"></i>
            </button>
        </div>

        <div class="auth-panel text-center">
            <!-- Logo inside form -->
            <a class="navbar-brand mb-4 d-inline-block fs-3" href="index.html">
                <i class="fa-solid fa-stroopwafel"></i> Sweet <span class="text-pink">Treats</span>
            </a>

            <h3 class="mb-4">Create an Account</h3>

            <form>
                <div class="mb-3 text-start">
                    <label class="form-label text-muted small">Full Name</label>
                    <input type="text" class="form-control rounded-pill px-4 py-2" placeholder="John Doe" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label text-muted small">Email Address</label>
                    <input type="email" class="form-control rounded-pill px-4 py-2" placeholder="Enter your email" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label text-muted small">Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control rounded-pill px-4 py-2 border-end-0" id="signupPassword" placeholder="Create a password" required style="border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important;">
                        <span class="input-group-text bg-white border-start-0 rounded-pill password-toggle" onclick="togglePassword('signupPassword', 'eyeIconSignup')" style="border-top-left-radius: 0 !important; border-bottom-left-radius: 0 !important;">
                            <i class="fa-regular fa-eye text-muted" id="eyeIconSignup"></i>
                        </span>
                    </div>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label text-muted small">Confirm Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control rounded-pill px-4 py-2 border-end-0" id="confirmPassword" placeholder="Confirm your password" required style="border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important;">
                        <span class="input-group-text bg-white border-start-0 rounded-pill password-toggle" onclick="togglePassword('confirmPassword', 'eyeIconConfirm')" style="border-top-left-radius: 0 !important; border-bottom-left-radius: 0 !important;">
                            <i class="fa-regular fa-eye text-muted" id="eyeIconConfirm"></i>
                        </span>
                    </div>
                </div>
                <div class="mb-4 text-start px-2">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="terms" required>
                        <label class="form-check-label small text-muted" for="terms">I agree to the <a href="#" class="text-pink text-decoration-none hover-underline">Terms and Conditions</a></label>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 mb-3">Sign Up</button>
                
                <div class="divider small">OR</div>

                <div class="d-flex flex-column gap-3 mb-4">
                    <a href="#" class="social-btn">
                        <i class="fa-brands fa-google text-danger"></i> Continue with Google
                    </a>
                    <a href="#" class="social-btn">
                        <i class="fa-brands fa-apple fs-5"></i> Continue with Apple
                    </a>
                </div>

                <p class="mb-0 text-muted small">Already have an account? <a href="login.html" class="text-pink text-decoration-none hover-underline fw-bold">Login</a></p>
            </form>
        </div>
    </div>

    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
